<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AMARANTA ACCESORIOS - Iniciar sesión</title>
  <meta name="description" content="AMARANTA ACCESORIOS - Accesorios que realzan tu estilo, calidad, tendencia y amor en cada detalle.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="amaranta-shell">
  <div class="container min-vh-100 d-flex align-items-center justify-content-center py-4">
    <div class="row justify-content-center w-100">
      <div class="col-md-6 col-lg-4">
        <div class="text-center mb-4">
          <a class="navbar-brand d-flex align-items-center gap-2 fw-bold justify-content-center" href="/">
            <span class="brand-mark"><i class="bi bi-gem"></i></span>
            <span>AMARANTA ACCESORIOS</span>
          </a>
          <p class="text-body-secondary small mt-2 mb-0">Panel de administración</p>
        </div>

        <div class="admin-card p-4 p-md-5 shadow-soft">
          <h1 class="h4 mb-4 text-center">Iniciar sesión</h1>

          <form id="loginForm" autocomplete="off">
            <div class="mb-3">
              <label class="form-label" for="username">Usuario</label>
              <input class="form-control" type="text" name="username" id="username" placeholder="admin" required autocomplete="off">
            </div>

            <div class="mb-4">
              <label class="form-label" for="password">Contraseña</label>
              <input class="form-control" type="password" name="password" id="password" placeholder="••••••••" required>
            </div>

            <div class="d-grid">
              <button class="btn btn-amaranta btn-lg" type="submit">
                <i class="bi bi-box-arrow-in-right me-1"></i>Iniciar sesión
              </button>
            </div>
          </form>

          ##
        </div>

        <div class="text-center mt-4">
          <a class="btn btn-outline-amaranta btn-sm" href="/">
            <i class="bi bi-house me-1"></i>Volver al catálogo
          </a>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('loginForm');

      form.addEventListener('submit', async (event) => {
        event.preventDefault();

        const button = form.querySelector('button[type="submit"]');

        try {
          button.disabled = true;
          button.textContent = 'Ingresando...';

          const username = form.elements.username.value.trim();
          const password = form.elements.password.value;

          const response = await fetch('/api/login', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Accept': 'application/json'
            },
            credentials: 'include',
            body: JSON.stringify({ username, password })
          });

          const text = await response.text();

          let data;
          try {
            data = text ? JSON.parse(text) : {};
          } catch {
            throw new Error(`El servidor respondió con HTTP ${response.status}`);
          }

          if (!response.ok || data.success === false) {
            throw new Error(data.message || `Error de inicio de sesión (${response.status})`);
          }

          window.location.href = '/admin/dashboard.html';
        } catch (error) {
          console.error('Login:', error);
          alert(error.message || 'No se pudo iniciar sesión');
        } finally {
          button.disabled = false;
          button.textContent = 'Iniciar sesión';
        }
      });
    });
  </script>
</body>
</html>
