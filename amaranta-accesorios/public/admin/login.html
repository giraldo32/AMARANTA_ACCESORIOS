<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>AMARANTA ACCESORIOS - Login</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="/css/style.css">
</head>

<body class="amaranta-shell">

<main class="min-vh-100 d-flex align-items-center justify-content-center p-3">

  <div class="card shadow-lg border-0"
       style="width:100%;max-width:430px;border-radius:24px;">

    <div class="card-body p-4 p-md-5">

      <div class="text-center mb-4">

        <div class="brand-mark mx-auto mb-3"
             style="width:64px;height:64px;">
          <i class="bi bi-gem text-white fs-3"></i>
        </div>

        <h1 class="h3 fw-bold mb-1">
          AMARANTA
        </h1>

        <p class="text-body-secondary">
          Panel de administración
        </p>

      </div>

      <div id="loginError"
           class="alert alert-danger d-none">
      </div>

      <form id="loginForm">

        <div class="mb-3">

          <label class="form-label">
            Usuario
          </label>

          <input
            type="text"
            class="form-control"
            id="username"
            name="username"
            autocomplete="username"
            required
          >

        </div>

        <div class="mb-4">

          <label class="form-label">
            Contraseña
          </label>

          <input
            type="password"
            class="form-control"
            id="password"
            name="password"
            autocomplete="current-password"
            required
          >

        </div>

        <button
          type="submit"
          class="btn btn-amaranta w-100"
          id="loginBtn"
        >
          <i class="bi bi-box-arrow-in-right me-1"></i>
          Iniciar sesión
        </button>

      </form>

      <div class="text-center mt-4">

        <a href="/" class="text-decoration-none">
          <i class="bi bi-arrow-left me-1"></i>
          Volver al catálogo
        </a>

      </div>

    </div>
  </div>

</main>

<script>

const form = document.getElementById('loginForm');
const errorBox = document.getElementById('loginError');
const button = document.getElementById('loginBtn');

form.addEventListener('submit', async (event) => {

  event.preventDefault();

  errorBox.classList.add('d-none');
  errorBox.textContent = '';

  button.disabled = true;
  button.innerHTML =
    '<span class="spinner-border spinner-border-sm me-2"></span>Ingresando...';

  const username =
    document.getElementById('username').value.trim();

  const password =
    document.getElementById('password').value;

  try {

    const response = await fetch('/api/login', {

      method: 'POST',

      credentials: 'same-origin',

      headers: {
        'Content-Type': 'application/json',
        'Accept': 'application/json'
      },

      body: JSON.stringify({
        username,
        password
      })

    });

    const contentType =
      response.headers.get('content-type') || '';

    let data;

    if (contentType.includes('application/json')) {

      data = await response.json();

    } else {

      const text = await response.text();

      throw new Error(
        `Error ${response.status}: ${
          text || 'Respuesta vacía del servidor'
        }`
      );

    }

    if (!response.ok || !data.success) {

      throw new Error(
        data.message ||
        'Usuario o contraseña incorrectos'
      );

    }

    window.location.href =
      '/admin/dashboard.html';

  } catch (error) {

    console.error('Error de login:', error);

    errorBox.textContent =
      error.message ||
      'No se pudo iniciar sesión';

    errorBox.classList.remove('d-none');

    button.disabled = false;

    button.innerHTML =
      '<i class="bi bi-box-arrow-in-right me-1"></i>Iniciar sesión';

  }

});

</script>

</body>
</html>
