<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AMARANTA ACCESORIOS - Login Admin</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="min-h-screen d-flex align-items-center justify-content-center px-3" style="background: radial-gradient(circle at top, rgba(135,206,235,.24), transparent 40%), linear-gradient(180deg, #f7fbff 0%, #ffffff 100%);">
  <section class="w-100" style="max-width: 520px;">
    <div class="admin-card p-4 p-md-5">
      <div class="text-center mb-4">
        <div class="brand-mark mx-auto mb-3"><i class="bi bi-gem text-white"></i></div>
        <h1 class="h2 mb-2" style="font-family:'Playfair Display', serif; color:#0a3554;">AMARANTA ACCESORIOS</h1>
        <p class="text-body-secondary mb-0">Acceso administrativo al catálogo, pedidos, categorías y configuración.</p>
      </div>
      <form id="loginForm" class="row g-3">
        <div class="col-12">
          <label class="form-label">Usuario</label>
          <div class="input-group input-group-lg">
            <span class="input-group-text bg-white"><i class="bi bi-person"></i></span>
            <input class="form-control" name="username" autocomplete="username" required placeholder="admin">
          </div>
        </div>
        <div class="col-12">
          <label class="form-label">Contraseña</label>
          <div class="input-group input-group-lg">
            <span class="input-group-text bg-white"><i class="bi bi-shield-lock"></i></span>
            <input type="password" class="form-control" name="password" autocomplete="current-password" required placeholder="••••••••">
          </div>
        </div>
        <div class="col-12 d-grid">
          <button class="btn btn-amaranta btn-lg" type="submit">Ingresar</button>
        </div>
        <div class="col-12 text-center">
          <a href="/" class="text-decoration-none">Volver al catálogo</a>
        </div>
      </form>
    </div>
  </section>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async function (event) {
      event.preventDefault();
      const formData = new FormData(event.target);
      const payload = Object.fromEntries(formData.entries());

      const response = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });

      const data = await response.json();
      if (data.success) {
        window.location.href = '/admin/dashboard.html';
        return;
      }

      alert(data.message || 'No fue posible iniciar sesión');
    });
  </script>
</body>
</html>
