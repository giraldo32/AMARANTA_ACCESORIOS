<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Administración | Amaranta Accesorios</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css"
    rel="stylesheet"
  >

  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        linear-gradient(
          135deg,
          #f8d7e8,
          #f5eef3
        );
      font-family: Arial, sans-serif;
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 25px;
      padding: 35px;
      box-shadow: 0 15px 45px rgba(0,0,0,.15);
    }

    .brand-icon {
      width: 70px;
      height: 70px;
      margin: 0 auto 15px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #8e4164;
      color: white;
      font-size: 30px;
    }

    .brand-title {
      text-align: center;
      font-weight: 700;
      color: #8e4164;
    }

    .brand-subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 30px;
    }

    .btn-login {
      width: 100%;
      background: #8e4164;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 12px;
      font-weight: 600;
    }

    .btn-login:hover {
      background: #71334f;
      color: white;
    }

    .error-message {
      display: none;
    }
  </style>
</head>

<body>

  <div class="login-card">

    <div class="brand-icon">
      <i class="bi bi-gem"></i>
    </div>

    <h1 class="brand-title">
      AMARANTA ACCESORIOS
    </h1>

    <p class="brand-subtitle">
      Panel de administración
    </p>

    <div
      id="errorMessage"
      class="alert alert-danger error-message"
    ></div>

    <form id="loginForm">

      <div class="mb-3">

        <label
          for="username"
          class="form-label"
        >
          Usuario
        </label>

        <div class="input-group">

          <span class="input-group-text">
            <i class="bi bi-person"></i>
          </span>

          <input
            type="text"
            class="form-control"
            id="username"
            name="username"
            placeholder="Usuario"
            autocomplete="username"
            required
          >

        </div>

      </div>

      <div class="mb-4">

        <label
          for="password"
          class="form-label"
        >
          Contraseña
        </label>

        <div class="input-group">

          <span class="input-group-text">
            <i class="bi bi-lock"></i>
          </span>

          <input
            type="password"
            class="form-control"
            id="password"
            name="password"
            placeholder="Contraseña"
            autocomplete="current-password"
            required
          >

        </div>

      </div>

      <button
        type="submit"
        class="btn btn-login"
        id="loginButton"
      >
        <i class="bi bi-box-arrow-in-right me-2"></i>
        Iniciar sesión
      </button>

    </form>

    <div class="text-center mt-4">

      <a
        href="/"
        class="text-decoration-none"
      >
        <i class="bi bi-arrow-left me-1"></i>
        Volver al catálogo
      </a>

    </div>

  </div>

<script>

const loginForm =
  document.getElementById('loginForm');

const loginButton =
  document.getElementById('loginButton');

const errorMessage =
  document.getElementById('errorMessage');


loginForm.addEventListener('submit', async (event) => {

  event.preventDefault();

  errorMessage.style.display = 'none';

  loginButton.disabled = true;

  loginButton.innerHTML =
    '<span class="spinner-border spinner-border-sm me-2"></span>' +
    'Ingresando...';

  const username =
    document.getElementById('username').value.trim();

  const password =
    document.getElementById('password').value;

  try {

    const response = await fetch('/api/login', {

      method: 'POST',

      headers: {
        'Content-Type': 'application/json'
      },

      credentials: 'include',

      body: JSON.stringify({
        username,
        password
      })

    });

    const data =
      await response.json();

    if (!response.ok || !data.success) {

      throw new Error(
        data.message ||
        'Usuario o contraseña incorrectos'
      );

    }

    window.location.href =
      '/admin/dashboard.html';

  } catch (error) {

    console.error(error);

    errorMessage.textContent =
      error.message ||
      'No se pudo iniciar sesión.';

    errorMessage.style.display =
      'block';

    loginButton.disabled = false;

    loginButton.innerHTML =
      '<i class="bi bi-box-arrow-in-right me-2"></i>' +
      'Iniciar sesión';
  }

});

</script>

</body>
</html>
